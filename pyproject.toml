[project]
name = "sylwanspot"
version = "0.1.0"
description = "Blog Django z polskim wyszukiwaniem pełnotekstowym"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django~=5.2",
    "python-decouple==3.8",
    "django-taggit==5.0.1",
    "markdown==3.6",
    "psycopg[binary]==3.1.18",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
    "ruff>=0.14",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
# RUF012 (mutable-class-default) fires pervasively on Django's own
# declarative idiom: Model.Meta/ModelAdmin/ModelForm.Meta attributes
# (ordering, list_display, fields, ...) and migration dependencies/
# operations are all class-level list/tuple/dict literals that the
# framework reads but never mutates on an instance. Annotating every
# framework-mandated attribute as typing.ClassVar would fight the
# framework rather than improve the code, and it would need repeating in
# every model/admin/form/migration file that will ever exist in this
# project. Silenced project-wide instead of per file.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Django auto-generates migrations; hand-editing them (including to satisfy
# lint rules) risks diverging from what `makemigrations` would regenerate,
# and the project constraints for this migration forbid touching migrations
# by hand. I001 fired on one file's import order (`ruff check --fix` would
# happily reorder it, but that is still an edit to a migration file, which
# is off limits here).
"src/blog/migrations/*" = ["E501", "I001"]

# E501 (line-too-long) below: `ruff format` (the next commit, Task 4) reflows
# code and will shrink most of these lines under 88 chars, but it cannot
# shorten long string literals, comments, or URLs -- those stay over the
# limit no matter how the formatter wraps surrounding code. Task 4 re-audits
# this whole list once formatting has landed and drops whatever ignore is no
# longer needed; nothing here is meant to be permanent.
"src/blog/models.py" = ["E501"]

"src/blog/tests/*" = ["E501"]

"src/blog/management/commands/rebuild_search_vectors.py" = ["E501"]

"src/blog/signals.py" = ["E501"]

"src/blog/templatetags/blog_tags.py" = ["E501"]

"src/blog/urls.py" = ["E501"]

"src/blog/views.py" = ["E501"]

"src/sylwanspot/settings.py" = ["E501"]

"src/sylwanspot/urls.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sylwanspot", "src/blog"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sylwanspot.settings"
python_files = ["test_*.py"]
testpaths = ["src"]
# --reuse-db: nie kasuj bazy testowej po przebiegu, użyj jej ponownie.
# Django i tak uruchamia na niej `migrate`, więc nowe migracje są wykrywane
# normalnie -- oszczędność bierze się z tego, że migracja 0005 (budowa słownika
# hunspell `polish`) nie wykonuje się od zera przy każdym wywołaniu.
#
# Czego reuse NIE wykryje: zmiany w już zastosowanej migracji. `migrate` ją
# pominie, zostawiając bazę ze starym schematem. W takim wypadku (a także po
# usunięciu, przenumerowaniu lub zgnieceniu migracji) trzeba raz uruchomić
# z --create-db.
addopts = "--reuse-db"
