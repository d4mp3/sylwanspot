[pytest]
DJANGO_SETTINGS_MODULE = sylwanspot.settings
python_files = test_*.py

# --reuse-db: do not drop the test database after the run; reuse it instead.
# Django runs `migrate` on it anyway, so new migrations are picked up
# normally -- the time-saver comes from migration 0005 (building the
# hunspell `polish` dictionary) not running from scratch on every invocation.
#
# What reuse will NOT catch: changes to an already applied migration.
# `migrate` skips it, leaving the database with the old schema.
# In that case (as well as after removing, renumbering, or squashing migrations),
# you need to run once with --create-db.
addopts = --reuse-db
