[project]
name = "sylwanspot"
version = "0.1.0"
description = "Blog Django z polskim wyszukiwaniem pełnotekstowym"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django~=5.2",
    "python-decouple==3.8",
    "django-taggit==5.0.1",
    "markdown==3.6",
    "psycopg[binary]==3.1.18",
]

[dependency-groups]
dev = [
    "pytest~=8.3",
    "pytest-django~=4.9",
    "ruff>=0.14",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sylwanspot", "src/blog"]
# The wheel is what the prod stage installs, and neither of these belongs in a
# runtime image: the test suite is developer-only, and settings_typecheck.py
# exists solely to seed fake database credentials into os.environ so mypy can
# import the settings module on the host. The patterns are matched against
# paths relative to the project root (source paths, before the src/ prefix is
# stripped), which is why they start with src/ -- a bare */tests/** matches
# nothing here.
exclude = ["src/*/tests/**", "src/*/settings_typecheck.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.format]
# Formatting-only excludes: the docs guide's Python examples use deliberately
# column-aligned trailing comments as a teaching device (see
# docs/przewodnik-po-projekcie.md), which `ruff format` would collapse to a
# single space before each `#` -- a real regression in that file's
# readability. Migrations are excluded from formatting because they are
# Django-generated (or, for 0005, hand-written SQL) and reformatting them is
# an edit this project's migration constraints forbid. This block only keeps
# the *formatter* out of both paths: migrations stay fully covered by `ruff
# check` (only E501 and I001 are silenced there, via the per-file-ignores
# below), while the documentation was never in the linter's scope to begin
# with -- `ruff check` does not discover `.md` files at all.
exclude = ["docs/**/*.md", "src/blog/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]
# RUF012 (mutable-class-default) fires pervasively on Django's own
# declarative idiom: Model.Meta/ModelAdmin/ModelForm.Meta attributes
# (ordering, list_display, fields, ...) and migration dependencies/
# operations are all class-level list/tuple/dict literals that the
# framework reads but never mutates on an instance. Annotating every
# framework-mandated attribute as typing.ClassVar would fight the
# framework rather than improve the code, and it would need repeating in
# every model/admin/form/migration file that will ever exist in this
# project. Silenced project-wide instead of per file.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Django auto-generates migrations; hand-editing them (including to satisfy
# lint rules) risks diverging from what `makemigrations` would regenerate,
# and the project constraints for this migration forbid touching migrations
# by hand. I001 fired on one file's import order (`ruff check --fix` would
# happily reorder it, but that is still an edit to a migration file, which
# is off limits here).
"src/blog/migrations/*" = ["E501", "I001"]

# E501: the f-string building the "recommend by email" message body is a
# single literal (subject/body text plus interpolated values); wrapping the
# surrounding code cannot shorten the string itself below 88 chars.
"src/blog/views.py" = ["E501"]

# E501: AUTH_PASSWORD_VALIDATORS' "NAME" values are dotted import-path string
# literals copied from Django's own validators; the longest one exceeds 88
# chars on its own, and no reformatting of the surrounding dict shortens it.
"src/sylwanspot/settings.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
files = ["src", "manage.py"]
ignore_missing_imports = true
# Without this, mypy skips the body of every function whose signature carries
# no annotations -- which here is every function in the project. The check
# would then cover module-level statements and class attributes only, and
# report success without having looked inside a single view, signal handler,
# template tag or test.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Django-generated (or, for 0005, hand-written SQL) migrations are off limits
# to hand-editing per this project's migration constraints, so they are not
# type-checked -- annotating them would mean editing files this task must
# not touch.
module = "blog.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "sylwanspot.settings_typecheck"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sylwanspot.settings"
python_files = ["test_*.py"]
testpaths = ["src"]
# --reuse-db: nie kasuj bazy testowej po przebiegu, użyj jej ponownie.
# Django i tak uruchamia na niej `migrate`, więc nowe migracje są wykrywane
# normalnie -- oszczędność bierze się z tego, że migracja 0005 (budowa słownika
# hunspell `polish`) nie wykonuje się od zera przy każdym wywołaniu.
#
# Czego reuse NIE wykryje: zmiany w już zastosowanej migracji. `migrate` ją
# pominie, zostawiając bazę ze starym schematem. W takim wypadku (a także po
# usunięciu, przenumerowaniu lub zgnieceniu migracji) trzeba raz uruchomić
# z --create-db.
addopts = "--reuse-db"
