# Wspólna definicja usługi webowej. Rozszerzenie `x-`, a nie usługa: compose
# ignoruje klucze najwyższego poziomu zaczynające się od `x-`, więc `up` nie ma
# tu czego wystartować. Jako usługa z `extends:` w potomkach uruchamiałaby się
# jak każda inna -- drugi, zbędny `runserver` obok `web_run`.
x-web: &web
  build:
    context: .
    target: dev
  working_dir: /code
  volumes:
    - .:/code
  environment:
    EMAIL_HOST_USER: 'damian.pszczola@gmail.com'
    EMAIL_HOST_PASSWORD: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
    DEFAULT_FROM_EMAIL: 'SylwanBlog <damian.pszczola@gmail.com>'
    DJANGO_SETTINGS_MODULE: "sylwanspot.settings"
    POSTGRES_DB: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    POSTGRES_HOST: "db"
    POSTGRES_PORT: "5432"
  networks:
    - backend

services:
  db:
    build: ./postgres
    image: sylwanspot-db:16.2
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web_migrate:
    <<: *web
    command: python manage.py migrate
    depends_on:
      db:
        condition: service_healthy

  web_run:
    <<: *web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      web_migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge