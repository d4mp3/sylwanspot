services:
  db:
    build: ./postgres
    image: sylwanspot-db:16.2
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  web:
    build:
      context: .
      target: dev
    working_dir: /code
    volumes:
      - .:/code
    environment:
      EMAIL_HOST_USER: 'damian.pszczola@gmail.com'
      EMAIL_HOST_PASSWORD: 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
      DEFAULT_FROM_EMAIL: 'SylwanBlog <damian.pszczola@gmail.com>'
      DJANGO_SETTINGS_MODULE: "sylwanspot.settings"
      POSTGRES_DB: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
    networks:
      - backend

  web_migrate:
    extends:
      service: web
    command: python manage.py migrate
    depends_on:
      db:
        condition: service_healthy

  web_run:
    extends:
      service: web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      web_migrate:
        condition: service_completed_successfully
    volumes:
      - ./:/code

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge